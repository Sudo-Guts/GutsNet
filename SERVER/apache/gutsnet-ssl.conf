# GutsNet + GutsCinema. Instalacion: make install-cinema.
<VirtualHost *:443>
    ServerName gutsnet.test
    DocumentRoot /var/www/gutsnet/public

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/gutsnet.crt
    SSLCertificateKeyFile /etc/ssl/private/gutsnet.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    <Directory /var/www/gutsnet/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Solo Cinema recibe archivos grandes; el resto del sitio conserva sus limites.
    <Directory "/var/www/gutsnet/public/cinema">
        LimitRequestBody 0
        <IfModule php_module>
            # Compatible con Apache que impide asignar memoria ejecutable a PHP.
            php_admin_flag pcre.jit Off
            php_admin_flag file_uploads On
            php_admin_value upload_max_filesize 2048M
            php_admin_value post_max_size 2050M
            php_admin_value max_file_uploads 1
            php_admin_value max_input_time 3600
            php_admin_value max_execution_time 300
        </IfModule>
    </Directory>

    Alias "/cinema/media/" "/home/gutsnet-shared/peliculas/"
    <Directory "/home/gutsnet-shared/peliculas/">
        Options -Indexes -FollowSymLinks -SymLinksIfOwnerMatch -ExecCGI -Includes
        AllowOverride None
        AcceptPathInfo Off
        AddType audio/mpeg .mp3
        AuthType Basic
        AuthName "GutsCinema"
        AuthUserFile /etc/gutsnet/cinema.htpasswd
        Require user gutsjail
    </Directory>

    # Protege catalogo, /cinema sin slash y cada URL directa de video.
    <LocationMatch "^/cinema(?:/|$)">
        AuthType Basic
        AuthName "GutsCinema"
        AuthUserFile /etc/gutsnet/cinema.htpasswd
        Require user gutsjail
        Header always set Cache-Control "private, no-store"
        Header always set X-Content-Type-Options "nosniff"
    </LocationMatch>

    # El almacenamiento multimedia nunca ejecuta PHP ni CGI.
    <Location "/cinema/media/">
        SetHandler default-handler
    </Location>
    # El catalogo es plano: audio y video, sin archivos ocultos ni subdirectorios.
    <LocationMatch "(?i)^/cinema/media/(?![^./][^/]*\.(?:mp4|mp3|webm|ogv)$)">
        Require all denied
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/gutsnet_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/gutsnet_ssl_access.log combined
</VirtualHost>
