# ============================================================
# GutsNet - HTTPS y biblioteca privada (mod_ssl + mod_auth_basic)
# ============================================================
#
# Requiere:
#   sudo a2enmod ssl auth_basic
#   Certificado y llave privada instalados en las rutas siguientes.
#   /etc/gutsnet/cinema.htpasswd (FUERA de DocumentRoot y de Git).
#   Peliculas en /home/gutsnet-shared/peliculas/.
#
# Activar SOLO despues de completar DOC/Instalacion.md.

<VirtualHost *:443>
    ServerName gutsnet.test
    DocumentRoot /var/www/gutsnet/public

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/gutsnet.crt
    SSLCertificateKeyFile /etc/ssl/private/gutsnet.key

    <Directory /var/www/gutsnet/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Los archivos privados NO estan dentro de /var/www.
    # Apache sirve MP4 directamente (incluidas las solicitudes Range).
    Alias "/cinema/media/" "/home/gutsnet-shared/peliculas/"

    <Directory "/home/gutsnet-shared/peliculas/">
        Options -Indexes -FollowSymLinks
        AllowOverride None
        AuthType Basic
        AuthName "GutsNet Cinema"
        AuthUserFile /etc/gutsnet/cinema.htpasswd
        Require valid-user
    </Directory>

    # Protege tambien el listado en PHP y todas sus rutas.
    <Location "/cinema/">
        AuthType Basic
        AuthName "GutsNet Cinema"
        AuthUserFile /etc/gutsnet/cinema.htpasswd
        Require valid-user
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/gutsnet_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/gutsnet_ssl_access.log combined
</VirtualHost>
