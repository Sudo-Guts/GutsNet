# GutsNet + GutsCinema. Instalacion: make install-cinema.
<VirtualHost *:443>
    ServerName gutsnet.test
    DocumentRoot /var/www/gutsnet/public

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/gutsnet.crt
    SSLCertificateKeyFile /etc/ssl/private/gutsnet.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    <Directory /var/www/gutsnet/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Alias "/cinema/media/" "/home/gutsnet-shared/peliculas/"
    <Directory "/home/gutsnet-shared/peliculas/">
        Options -Indexes -FollowSymLinks -SymLinksIfOwnerMatch -ExecCGI -Includes
        AllowOverride None
        AcceptPathInfo Off
        AuthType Basic
        AuthName "GutsCinema"
        AuthUserFile /etc/gutsnet/cinema.htpasswd
        Require valid-user
    </Directory>

    # Protege catalogo, /cinema sin slash y cada URL directa de video.
    <LocationMatch "^/cinema(?:/|$)">
        AuthType Basic
        AuthName "GutsCinema"
        AuthUserFile /etc/gutsnet/cinema.htpasswd
        Require valid-user
        Header always set Cache-Control "private, no-store"
        Header always set X-Content-Type-Options "nosniff"
    </LocationMatch>

    # El almacenamiento multimedia nunca ejecuta PHP ni CGI.
    <Location "/cinema/media/">
        SetHandler default-handler
    </Location>
    # El catalogo es plano: solo archivos de video de estas extensiones.
    <LocationMatch "(?i)^/cinema/media/(?![^/]+\.(?:mp4|webm|ogv)$)">
        Require all denied
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/gutsnet_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/gutsnet_ssl_access.log combined
</VirtualHost>
