<VirtualHost *:80>
    ServerName gutsnet.test

    DocumentRoot /var/www/gutsnet/public

    <Directory /var/www/gutsnet/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/gutsnet_error.log
    CustomLog ${APACHE_LOG_DIR}/gutsnet_access.log combined
</VirtualHost>
