<VirtualHost *:80>
    ServerName gutsnet.test

    # Nunca solicitar credenciales privadas por HTTP.
    # El contenido /cinema/ solo se sirve en el VirtualHost HTTPS.
    # Conserva la IP de acceso: un telefono no conoce el /etc/hosts de Ubuntu.
    # Solo refleja el nombre local o direcciones literales; descarta el puerto 80.
    RewriteEngine On
    RewriteCond %{HTTP_HOST} "^(gutsnet\.test|localhost|[0-9]{1,3}(?:\.[0-9]{1,3}){3}|\[[0-9a-f:]+\])(?::80)?$" [NC]
    RewriteRule "^/cinema(?:/(.*))?$" "https://%1/cinema/$1" [R=302,L]
    RewriteRule "^/cinema(?:/(.*))?$" "https://gutsnet.test/cinema/$1" [R=302,L]

    DocumentRoot /var/www/gutsnet/public

    <Directory /var/www/gutsnet/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/gutsnet_error.log
    CustomLog ${APACHE_LOG_DIR}/gutsnet_access.log combined
</VirtualHost>
