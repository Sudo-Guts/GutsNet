# GutsNet - FTPS explicito, Ubuntu, puerto 21
# Instalar mediante sudo bash SERVER/ftp/install.sh --install.
listen=YES
listen_ipv6=NO
listen_port=21

anonymous_enable=NO
local_enable=YES
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd.gutsnet-users
pam_service_name=vsftpd

write_enable=YES
local_root=/home/gutsnet-shared/ftp
chroot_local_user=YES
allow_writeable_chroot=NO
local_umask=007
file_open_mode=0666

pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40010
port_enable=NO

ssl_enable=YES
implicit_ssl=NO
force_local_logins_ssl=YES
force_local_data_ssl=YES
ssl_sslv2=NO
ssl_sslv3=NO
ssl_tlsv1=NO
ssl_tlsv1_1=NO
ssl_tlsv1_2=YES
ssl_tlsv1_3=YES
rsa_cert_file=/etc/ssl/certs/gutsnet.crt
rsa_private_key_file=/etc/ssl/private/gutsnet.key

xferlog_enable=YES
use_localtime=YES
ftpd_banner=GutsNet FTPS
hide_ids=YES
max_clients=10
max_per_ip=3
idle_session_timeout=300
data_connection_timeout=120
