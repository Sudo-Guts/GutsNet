# Apache ProtectHome=read-only; la publicacion atomica (link) necesita
# que staging y biblioteca compartan el mismo montaje escribible.
# El padre sigue siendo root:root 755; el acceso real depende de ACL/permisos
# de peliculas y .cinema-incoming, no de ReadWritePaths por si solo.
[Service]
ReadWritePaths=/home/gutsnet-shared
