# BEGIN GUTSNET JAIL
# Esta seccion debe estar al FINAL de /etc/ssh/sshd_config.
# La inserta SERVER/ssh/install.sh luego de respaldar y validar.
Match User gutsjail
    ChrootDirectory /home/gutsnet-jail
    DisableForwarding yes
    PermitTTY yes
    PermitUserRC no
    PasswordAuthentication yes
    PubkeyAuthentication no
    AuthenticationMethods password
    MaxSessions 1
# END GUTSNET JAIL
