# Cliente saliente de gutsjail. Este archivo es propiedad de root.
Host *
    EscapeChar none
    EnableEscapeCommandline no
    PermitLocalCommand no
    ProxyCommand none
    ProxyJump none
    ClearAllForwardings yes
    ForwardAgent no
    ForwardX11 no
    ForwardX11Trusted no
    Tunnel no
    ControlMaster no
    ControlPath none
    IdentityAgent none
    PubkeyAuthentication no
    HostbasedAuthentication no
    GSSAPIAuthentication no
    PreferredAuthentications keyboard-interactive,password
    UserKnownHostsFile /var/lib/gutsnet-ssh/known_hosts
    GlobalKnownHostsFile /dev/null
    StrictHostKeyChecking ask
    HashKnownHosts yes
    UpdateHostKeys no
    ConnectTimeout 10
    ConnectionAttempts 1
